# Un SKU regional por entrada, curado a mano. Si falta un dato se deja null: nunca se inventa.
# Validar con: uv run python -m scripts.validate_data
#
# Formato (ejemplo ficticio, no es un dato real):
# - sku_id: "asia-example-game-standard"   # {region en minúsculas}-{title_id}-{edition}
#   title_id: "example-game"                # debe existir en titles.yaml
#   region: "ASIA"                          # EU | NA | JP | KR | ASIA (HK/TW/SEA)
#   edition: "standard"                     # standard | deluxe | collectors
#   distributor: "Example Distributor"      # quien lo saca en ESE mercado; null si no se sabe
#   release_date: "2026-03-12"              # null si no hay fecha en ese mercado
#   format: "full_cart"                     # full_cart | game_key_card | code_in_box | unknown
#   cart_size_gb: 64                        # solo con full_cart
#   download_size_gb: null                  # aproximado: cambia con los parches
#   includes_download_code: null            # true si la caja trae además un código (DLC, pase...); null si no se sabe
#   ean: null                               # entre comillas: "0045496123456"
#   evidence: "box_photo"                   # official | box_photo | retailer_listing | press_report | unconfirmed
#   source_url: "https://example.com/..."   # obligatorio salvo format: unknown
#   verified_at: "2026-09-13"
#   status: "new"                           # new | pending | reviewed | refresh
#
# El status dice en qué punto está cada SKU, y es lo que decide si sale en la web:
#   new      = borrador sin fuente que lo respalde (p. ej. format: unknown). NO sale en la web.
#   reviewed = su fuente se ha abierto y dice lo que dice el SKU. Sale en la web.
#   pending  = publicado, pero apuntado para repasarlo con calma. Sale en la web.
#   refresh  = hay que volver a buscar evidencias en la web sobre su formato (dato viejo, fuente caída,
#              región nueva). Sale en la web.
# Con la fuente abierta y citada en el comentario, el SKU se escribe directamente como reviewed.
# Sin source_url no se pone reviewed nunca.

