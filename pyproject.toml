[project]
name = "switch2db"
version = "0.1.0"
description = "Base de datos abierta del formato físico de los juegos de Nintendo Switch 2"
requires-python = ">=3.11"
dependencies = [
    "aws-lambda-powertools>=3.34.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
